name: Publish learn site

# Build academy image → GHCR → deploy to sailpoint ns (edge + mnb-learn)
# Public: https://sailpoint.lmsapp.us/   IIQ: https://sailpoint.lmsapp.us/identityiq/
# Path-filtered: lesson/learn changes only. Smoke is opt-in (flaky through edge/CF).

on:
  push:
    branches: [main, master]
    paths:
      - "docs/lessons/**"
      - "learn/**"
      # Intentionally omit this workflow file: editing CD YAML alone should not rebuild academy.
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Build/push only (skip cluster deploy)
        type: boolean
        default: false
      run_smoke:
        description: Run flaky public/in-cluster smoke (off by default)
        type: boolean
        default: false

permissions: {}

concurrency:
  # Every workflow that mutates the sailpoint namespace shares this lock.
  group: homelab-sailpoint-deploy
  cancel-in-progress: false

env:
  LEARN_SMOKE_URL: https://sailpoint.lmsapp.us/
  IIQ_SMOKE_URL: https://sailpoint.lmsapp.us/identityiq/login.jsf

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image tag
        id: meta
        run: |
          set -euo pipefail
          OWNER=$(tr '[:upper:]' '[:lower:]' <<<"${{ github.repository_owner }}")
          {
            echo "tag=${GITHUB_SHA:0:7}"
            echo "owner=${OWNER}"
          } >> "$GITHUB_OUTPUT"
          echo "Using ghcr.io/${OWNER}/mnb-iam-learn:${GITHUB_SHA:0:7}"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: learn/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mnb-iam-learn:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/mnb-iam-learn:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=mnb-iam-learn
          cache-to: type=gha,mode=max,scope=mnb-iam-learn
          provenance: false
          sbom: false

  deploy:
    name: Deploy public surface
    needs: build-push
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.skip_deploy != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: homelab
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connect Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.HOMELAB_TS_PING_IP || '192.168.50.11' }}

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Write kubeconfig
        env:
          HOMELAB_KUBECONFIG: ${{ secrets.HOMELAB_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$HOMELAB_KUBECONFIG" ]; then
            echo "::error::Missing secret HOMELAB_KUBECONFIG"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$HOMELAB_KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Ensure ghcr-pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          bash .github/scripts/ensure-ghcr-pull-secret.sh

      - name: Install academy + edge
        env:
          LEARN_IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          GHCR_OWNER: ${{ needs.build-push.outputs.owner }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          chmod +x learn/k8s/install-public-surface.sh
          ./learn/k8s/install-public-surface.sh

      - name: In-cluster smoke (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.run_smoke == true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          bash .github/scripts/smoke-in-cluster-surface.sh

  smoke:
    name: Smoke academy + IIQ
    needs: deploy
    if: >
      always() &&
      needs.deploy.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe public URLs
        run: |
          set -euo pipefail
          bash .github/scripts/smoke-public-surface.sh

  gate:
    name: Publish learn gate
    needs: [build-push, deploy, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate
        env:
          BUILD: ${{ needs.build-push.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SMOKE: ${{ needs.smoke.result }}
          TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          {
            echo "## Publish learn"
            echo ""
            echo "- Image tag: \`${TAG:-}\`"
            echo "- Build: \`${BUILD}\`"
            echo "- Deploy: \`${DEPLOY}\`"
            echo "- Smoke: \`${SMOKE}\` (opt-in; skipped is OK)"
            echo "- Academy: https://sailpoint.lmsapp.us/"
            echo "- IIQ: https://sailpoint.lmsapp.us/identityiq/login.jsf"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$BUILD" = "success" ] || exit 1
          if [ "$DEPLOY" = "skipped" ]; then
            echo "Deploy skipped"
            exit 0
          fi
          [ "$DEPLOY" = "success" ] || exit 1
          [ "$SMOKE" = "success" ] || [ "$SMOKE" = "skipped" ] || exit 1
