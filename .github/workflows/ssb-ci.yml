name: SSB CI

# PR / develop / manual: full sandbox war (needs GA OCI).
# main/master push: skip full war when Publish GHCR path filter would also run
# (thin Docker build owns those paths — avoid paying Ant+GA twice).

on:
  push:
    branches: [main, master, develop]
    paths:
      - config/**
      - src/**
      - web/**
      - lib/**
      - scripts/**
      - build.xml
      - build.sh
      - build.bat
      - build.properties
      - homelab.*
      - sandbox.*
      - servers.properties
      - .github/workflows/ssb-ci.yml
  pull_request:
    paths:
      - config/**
      - src/**
      - web/**
      - lib/**
      - scripts/**
      - build.xml
      - build.sh
      - build.bat
      - build.properties
      - homelab.*
      - sandbox.*
      - servers.properties
      - .github/workflows/ssb-ci.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ssb-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ssb-war:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether to run full war
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ "${{ github.ref_name }}" = "develop" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main/master push — skip if publish-relevant paths changed
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
          else
            CHANGED=$(git show --name-only --pretty='' HEAD || true)
          fi
          echo "Changed files:"
          echo "$CHANGED"
          if grep -qE '^(config/|src/|web/|lib/|scripts/|docker/Dockerfile$|docker/entrypoint\.sh|docker/setenv\.sh|build\.xml|build\.sh|build\.bat|build\.properties|homelab\.|sandbox\.|servers\.properties|VERSION|\.github/workflows/publish-ghcr\.yml)' <<<"$CHANGED"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Publish GHCR covers these paths — skipping duplicate SSB war on main"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install oras
        if: steps.gate.outputs.run == 'true'
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Log in to GHCR
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Cache GA zip
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base/ga/identityiq-8.5.zip
          key: identityiq-ga-8.5-v1

      - name: Ensure GA zip
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p base/ga
          if [ -f base/ga/identityiq-8.5.zip ]; then
            ls -lh base/ga/identityiq-8.5.zip
            exit 0
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REF="ghcr.io/${OWNER}/mnb-iam-ga:8.5"
          echo "Pulling ${REF}"
          oras pull "$REF" -o base/ga
          if [ ! -f base/ga/identityiq-8.5.zip ]; then
            shopt -s nullglob
            zips=(base/ga/*.zip)
            found="${zips[0]:-}"
            test -n "$found"
            mv "$found" base/ga/identityiq-8.5.zip
          fi
          ls -lh base/ga/identityiq-8.5.zip

      - name: Set up JDK 11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "11"

      - name: SSB clean war (sandbox)
        if: steps.gate.outputs.run == 'true'
        env:
          SPTARGET: sandbox
        run: |
          set -euo pipefail
          chmod +x build.sh lib/ant/bin/ant lib/ant/bin/antRun
          ./build.sh -Dtarget=sandbox clean war

      - name: Upload WAR artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identityiq-war-sandbox
          path: |
            build/deploy/identityiq.war
            build/deploy/identityiq.war.MD5
          if-no-files-found: error

      - name: Skipped notice
        if: steps.gate.outputs.run != 'true'
        run: echo "Skipped full SSB war — covered by Publish GHCR thin image build"
