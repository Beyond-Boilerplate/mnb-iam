name: SSB CI

# Builds IdentityIQ with SailPoint Services Standard Build (SSB).
# GA zip: prefer workspace file; else oras pull from GHCR OCI artifact.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ssb-war:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure GA zip
        run: |
          set -euo pipefail
          mkdir -p base/ga
          if [ -f base/ga/identityiq-8.5.zip ]; then
            ls -lh base/ga/identityiq-8.5.zip
            exit 0
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REF="ghcr.io/${OWNER}/mnb-iam-ga:8.5"
          echo "Pulling ${REF}"
          oras pull "$REF" -o base/ga
          if [ ! -f base/ga/identityiq-8.5.zip ]; then
            found=$(find base/ga -name '*.zip' | head -1)
            test -n "$found"
            mv "$found" base/ga/identityiq-8.5.zip
          fi
          ls -lh base/ga/identityiq-8.5.zip

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: SSB clean war (sandbox)
        env:
          SPTARGET: sandbox
        run: |
          chmod +x build.sh lib/ant/bin/ant lib/ant/bin/antRun
          ./build.sh -Dtarget=sandbox clean war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: identityiq-war-sandbox
          path: |
            build/deploy/identityiq.war
            build/deploy/identityiq.war.MD5
          if-no-files-found: error
