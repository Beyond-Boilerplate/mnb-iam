name: Publish IIQ base image

# Rare: GA expand + JDBC → ghcr.io/<owner>/identityiq-base:8.5
# Routine app publishes FROM this image (no GA re-expand).

on:
  workflow_dispatch:
    inputs:
      iiq_version:
        description: IIQ major.minor tag (matches GA OCI + base image tag)
        required: true
        default: "8.5"
        type: choice
        options:
          - "8.5"
  push:
    branches: [main, master]
    paths:
      - docker/Dockerfile.base
      - web/WEB-INF/lib/postgresql-*.jar
      - .github/workflows/publish-base.yml

concurrency:
  group: publish-base-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish-base:
    name: Build identityiq-base
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR (read GA)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull GA zip from OCI
        env:
          IIQ_VERSION: ${{ github.event.inputs.iiq_version || '8.5' }}
        run: |
          set -euo pipefail
          mkdir -p base/ga
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ZIP="base/ga/identityiq-${IIQ_VERSION}.zip"
          if [ ! -f "$ZIP" ]; then
            REF="ghcr.io/${OWNER}/mnb-iam-ga:${IIQ_VERSION}"
            echo "oras pull ${REF}"
            oras pull "$REF" -o base/ga
            if [ ! -f "$ZIP" ]; then
              # OCI layer annotations sometimes nest paths (base/ga/base/ga/...).
              shopt -s nullglob globstar
              candidates=(base/ga/**/*.zip base/ga/*.zip)
              found=""
              for candidate in "${candidates[@]}"; do
                if [[ "$(basename "$candidate")" == "identityiq-${IIQ_VERSION}.zip" ]] || [[ -z "$found" ]]; then
                  found="$candidate"
                  [[ "$(basename "$candidate")" == "identityiq-${IIQ_VERSION}.zip" ]] && break
                fi
              done
              if [ -z "$found" ]; then
                echo "::error::oras pull succeeded but no zip was written under base/ga"
                find base/ga -maxdepth 4 -type f -print || true
                exit 1
              fi
              echo "Normalizing ${found} → ${ZIP}"
              mv "$found" "$ZIP"
            fi
          fi
          ls -lh "$ZIP"

          shopt -s nullglob
          jdbc_jars=(web/WEB-INF/lib/postgresql-*.jar)
          if (( ${#jdbc_jars[@]} == 0 )); then
            echo "PostgreSQL JDBC jar missing from checkout; downloading 42.7.4 from Maven Central"
            mkdir -p web/WEB-INF/lib
            curl -fsSL \
              -o web/WEB-INF/lib/postgresql-42.7.4.jar \
              "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar"
            jdbc_jars=(web/WEB-INF/lib/postgresql-*.jar)
          fi
          if (( ${#jdbc_jars[@]} != 1 )); then
            echo "::error::Expected exactly one PostgreSQL JDBC jar; found ${#jdbc_jars[@]}"
            ls -la web/WEB-INF/lib 2>/dev/null || true
            exit 1
          fi
          echo "Using JDBC driver ${jdbc_jars[0]}"
          ls -lh "${jdbc_jars[0]}"

      - name: Log in to GHCR (push)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push identityiq-base
        env:
          IIQ_VERSION: ${{ github.event.inputs.iiq_version || '8.5' }}
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="ghcr.io/${OWNER}/identityiq-base:${IIQ_VERSION}"
          docker buildx build \
            --platform linux/amd64 \
            --file docker/Dockerfile.base \
            --tag "${TAG}" \
            --tag "ghcr.io/${OWNER}/identityiq-base:latest" \
            --cache-from "type=gha,scope=ghcr-identityiq-base" \
            --cache-from "type=registry,ref=ghcr.io/${OWNER}/identityiq-base:buildcache" \
            --cache-to "type=gha,mode=max,scope=ghcr-identityiq-base" \
            --cache-to "type=registry,ref=ghcr.io/${OWNER}/identityiq-base:buildcache,mode=max" \
            --provenance=false \
            --sbom=false \
            --push \
            .
          {
            echo "### Base image"
            echo ""
            echo "\`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
