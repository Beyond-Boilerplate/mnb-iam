name: Publish GHCR images

# Thin app image FROM identityiq-base (no GA oras / no full expand).
# Tags: VERSION + latest + short SHA.
# Provenance/SBOM only when SemVer is bumped via workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      increment_type:
        description: SemVer bump of VERSION before publish
        required: true
        type: choice
        options: [patch, minor, major, none]
        default: none
  push:
    branches: [main, master]
    paths:
      - config/**
      - src/**
      - web/**
      - docker/Dockerfile
      - docker/entrypoint.sh
      - docker/setenv.sh
      - build.xml
      - build.sh
      - build.bat
      - build.properties
      - lib/**
      - scripts/**
      - homelab.*
      - sandbox.*
      - servers.properties
      - VERSION
      - .github/workflows/publish-ghcr.yml
  workflow_run:
    workflows: ["Publish IIQ base image"]
    types: [completed]

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: Resolve version
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      owner: ${{ steps.meta.outputs.owner }}
      sha_short: ${{ steps.meta.outputs.sha_short }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      attest: ${{ steps.meta.outputs.attest }}
      build_image: ${{ steps.meta.outputs.build_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump VERSION
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          INCREMENT_TYPE: ${{ github.event.inputs.increment_type || 'none' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TYPE="${INCREMENT_TYPE}"
          else
            TYPE="none"
          fi
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"
          if [ "$TYPE" = "none" ]; then
            exit 0
          fi
          CUR=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$CUR" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be strict MAJOR.MINOR.PATCH; got '${CUR}'"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"$CUR"
          case "$TYPE" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse --verify --quiet "refs/tags/v${NEW}" >/dev/null; then
            echo "::error::Release tag v${NEW} already exists; release tags are immutable."
            exit 1
          fi
          echo "$NEW" > VERSION
          echo "bumped ${CUR} → ${NEW}"

      - name: Sync Helm image tag
        if: steps.bump.outputs.type != 'none'
        run: |
          set -euo pipefail
          TAG=$(tr -d '[:space:]' < VERSION)
          python3 - "$TAG" <<'PY'
          from pathlib import Path
          import re, sys
          tag = sys.argv[1]
          path = Path("deploy/helm/values/local-homelab.yaml")
          text = path.read_text()
          text2, n = re.subn(
              r'(repository:\s*ghcr\.io/beyond-boilerplate/identityiq\s*\n\s*tag:\s*)"[^"]+"',
              rf'\1"{tag}"',
              text,
          )
          if n == 0:
              raise SystemExit("no helm identityiq tag updated")
          path.write_text(text2)
          print(f"updated helm tag → {tag}")
          PY

      - name: Commit version bump
        if: steps.bump.outputs.type != 'none'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION deploy/helm/values/local-homelab.yaml
          if git diff --staged --quiet; then
            exit 0
          fi
          TAG=$(tr -d '[:space:]' < VERSION)
          git commit -m "chore: bump version to ${TAG} [skip ci]"
          git push

      - name: Emit metadata
        id: meta
        run: |
          set -euo pipefail
          TAG=$(tr -d '[:space:]' < VERSION)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_SHA=$(git rev-parse HEAD)
          ATTEST=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.increment_type || 'none' }}" != "none" ]; then
            ATTEST=true
          fi

          BUILD_IMAGE=true
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "$BEFORE" "${COMMIT_SHA}" || true)
            else
              CHANGED=$(git show --name-only --pretty='' HEAD || true)
            fi
            echo "Changed files:"
            echo "$CHANGED"
            if ! grep -qE '^(config/|src/|web/|lib/|scripts/|docker/Dockerfile$|docker/entrypoint\.sh|docker/setenv\.sh|build\.xml|build\.sh|build\.bat|build\.properties|homelab\.|sandbox\.|servers\.properties|VERSION)' <<<"$CHANGED"; then
              BUILD_IMAGE=false
              echo "No IIQ source changes — skipping thin image rebuild (workflow-only)"
            fi
          fi

          {
            echo "image_tag=${TAG}"
            echo "owner=${OWNER}"
            echo "sha_short=${COMMIT_SHA::7}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "attest=${ATTEST}"
            echo "build_image=${BUILD_IMAGE}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build identityiq
    needs: prepare
    if: needs.prepare.outputs.build_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (push)
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push identityiq (thin, no attest)
        if: needs.prepare.outputs.attest != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          pull: true
          build-args: |
            SPTARGET=homelab
            IIQ_BASE_IMAGE=ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq-base:8.5
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:${{ needs.prepare.outputs.image_tag }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:latest
            ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:${{ needs.prepare.outputs.sha_short }}
          cache-from: |
            type=gha,scope=ghcr-identityiq
            type=registry,ref=ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:buildcache
          cache-to: |
            type=gha,mode=max,scope=ghcr-identityiq
            type=registry,ref=ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:buildcache,mode=max

      - name: Build and push identityiq (thin, attest)
        if: needs.prepare.outputs.attest == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          pull: true
          build-args: |
            SPTARGET=homelab
            IIQ_BASE_IMAGE=ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq-base:8.5
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:${{ needs.prepare.outputs.image_tag }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:latest
            ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:${{ needs.prepare.outputs.sha_short }}
          cache-from: |
            type=gha,scope=ghcr-identityiq
            type=registry,ref=ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:buildcache
          cache-to: |
            type=gha,mode=max,scope=ghcr-identityiq
            type=registry,ref=ghcr.io/${{ needs.prepare.outputs.owner }}/identityiq:buildcache,mode=max

  tag-release:
    name: Tag release
    needs: [prepare, build]
    if: needs.prepare.outputs.attest == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
      - name: Create immutable release tag
        env:
          TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag v${TAG} already exists; refusing to rewrite it."
            exit 1
          fi
          git tag "v${TAG}"
          git push origin "v${TAG}"

  deploy:
    name: Deploy homelab
    needs: [prepare, build]
    if: >
      needs.prepare.outputs.build_image == 'true' &&
      needs.build.result == 'success' &&
      (github.event_name == 'workflow_run' ||
       github.ref_name == 'main' ||
       github.ref_name == 'master')
    uses: ./.github/workflows/deploy-homelab.yml
    permissions:
      contents: read
      packages: read
    with:
      image_tag: ${{ needs.prepare.outputs.sha_short }}
      install_phase: app
      run_smoke: false
    secrets: inherit

  summarize:
    name: Publish summary
    needs: [prepare, build, deploy]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        env:
          BUILD_IMAGE: ${{ needs.prepare.outputs.build_image }}
          BUILD: ${{ needs.build.result }}
          TAG: ${{ needs.prepare.outputs.image_tag }}
          OWNER: ${{ needs.prepare.outputs.owner }}
          SHA: ${{ needs.prepare.outputs.sha_short }}
          ATTEST: ${{ needs.prepare.outputs.attest }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          {
            echo "## GHCR publish (thin)"
            echo ""
            echo "- Build image: \`${BUILD_IMAGE}\`"
            echo "- Image tag: \`${TAG}\`"
            echo "- SHA tag: \`${SHA}\`"
            echo "- Owner: \`${OWNER}\`"
            echo "- Base: \`ghcr.io/${OWNER}/identityiq-base:8.5\`"
            echo "- Attest/SBOM: \`${ATTEST}\`"
            echo "- Build: \`${BUILD}\`"
            echo "- Homelab deploy: \`${DEPLOY}\`"
            echo "- Smoke: skipped (opt-in via Deploy homelab run_smoke)"
            echo ""
            echo "\`ghcr.io/${OWNER}/identityiq:${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_IMAGE" != "true" ]; then
            echo "No IIQ source changes — skipped rebuild/deploy (ops Deploy handles helm-only)."
            exit 0
          fi
          if [ "$BUILD" != "success" ]; then
            echo "::error::identityiq image build failed (is identityiq-base:8.5 published?)"
            exit 1
          fi
          if [ "$DEPLOY" != "success" ] && [ "$DEPLOY" != "skipped" ]; then
            echo "::error::identityiq image published but homelab deploy failed"
            exit 1
          fi
