name: Deploy homelab

# Tailscale → Helm into namespace sailpoint.
# Success = Helm upgrade + rollout Ready (TCP probes). Smoke is opt-in (flaky through edge/CF).
#
# Required secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, HOMELAB_KUBECONFIG
# Setup: docs/HOMELAB-CD.md

on:
  # Helm/ops-only: redeploy without rebuilding the IIQ image
  push:
    branches: [main, master]
    paths:
      - deploy/**
      - .github/workflows/deploy-homelab.yml
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run flaky public/in-cluster smoke (off by default)
        type: boolean
        default: false
      image_tag:
        description: GHCR tag (sha7 or semver). Empty keeps live tag.
        type: string
        required: false
        default: ""
      install_phase:
        description: Helm phase (auto|app|all|data)
        type: string
        required: false
        default: auto
      wipe_mnb_leftovers:
        description: Delete leftover MNB apps/tasks/identities (keep spadmin + HelloWorld)
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_smoke:
        description: Run flaky public/in-cluster smoke (off by default)
        type: boolean
        default: false
      image_tag:
        description: Immutable GHCR tag emitted by the publisher
        type: string
        required: true
      install_phase:
        description: Helm install phase (auto|app|all|data)
        type: string
        default: app
      wipe_mnb_leftovers:
        description: Delete leftover MNB apps/tasks/identities (keep spadmin + HelloWorld)
        type: boolean
        default: false

concurrency:
  # Shared with publish-learn / publish-ghcr deploy so kubectl+Helm never race.
  group: homelab-sailpoint-deploy
  cancel-in-progress: false

permissions: {}

env:
  IIQ_SMOKE_URL: https://sailpoint.lmsapp.us/identityiq/login.jsf

jobs:
  decide:
    name: Decide deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Path gate
        id: gate
        run: |
          set -euo pipefail
          # Publisher / manual pin always deploys. Note: reusable workflow_call inherits
          # the caller's event_name (often "push"), so do NOT key only on event_name.
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=image_tag provided (${{ inputs.image_tag }})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=explicit workflow_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
          else
            CHANGED=$(git show --name-only --pretty='' HEAD || true)
          fi
          echo "Changed files:"
          echo "$CHANGED"

          # Ops push that also changes IIQ sources: Publish GHCR owns Helm (this job
          # has no image_tag). Pure deploy/** changes still deploy here.
          if grep -qE '^(config/|src/|web/|lib/|scripts/|docker/Dockerfile$|docker/entrypoint\.sh|docker/setenv\.sh|build\.xml|build\.sh|build\.bat|build\.properties|homelab\.|sandbox\.|servers\.properties|VERSION)' <<<"$CHANGED"; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=Publish GHCR owns this commit (IIQ sources changed; no image_tag on ops path)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "reason=helm/ops-only paths" >> "$GITHUB_OUTPUT"

  helm-upgrade:
    name: Helm upgrade
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: homelab
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connect Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.HOMELAB_TS_PING_IP || '192.168.50.11' }}

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Write kubeconfig
        env:
          HOMELAB_KUBECONFIG: ${{ secrets.HOMELAB_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${HOMELAB_KUBECONFIG}" ]; then
            echo "::error::Missing secret HOMELAB_KUBECONFIG"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$HOMELAB_KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          export KUBECONFIG="$HOME/.kube/config"
          SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          echo "API server: ${SERVER}"

      - name: Verify cluster
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          kubectl get nodes
          kubectl -n sailpoint get deploy,pods 2>/dev/null || echo "namespace sailpoint not ready yet"

      - name: Ensure ghcr-pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          bash .github/scripts/ensure-ghcr-pull-secret.sh

      - name: Helm upgrade sailpoint
        env:
          VERIFY_IMAGE_TAGS: "true"
          GHCR_OWNER: ${{ github.repository_owner }}
          HELM_TIMEOUT: 10m
          INSTALL_PHASE: ${{ inputs.install_phase }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          chmod +x deploy/helm/scripts/install-sailpoint.sh deploy/helm/scripts/update-deps.sh

          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME:-${{ github.actor }}}" --password-stdin
          else
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
            export IMAGE_TAG
            echo "Deploying requested IMAGE_TAG=${IMAGE_TAG}"
          else
            LIVE=$(kubectl -n sailpoint get deploy identityiq -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            if [[ "$LIVE" == *:* ]]; then
              IMAGE_TAG="${LIVE##*:}"
              export IMAGE_TAG
              echo "Preserving live IMAGE_TAG=${IMAGE_TAG} (${{ github.event_name }})"
            else
              IMAGE_TAG="$(tr -d '[:space:]' < VERSION)"
              export IMAGE_TAG
              echo "Bootstrap IMAGE_TAG=${IMAGE_TAG} from VERSION"
            fi
          fi
          if ! ./deploy/helm/scripts/install-sailpoint.sh deploy/helm/values/local-homelab.yaml; then
            echo "::error::Helm upgrade failed"
            kubectl -n sailpoint get deploy,pods,pvc,svc,jobs -o wide || true
            kubectl -n sailpoint get events --sort-by=.lastTimestamp | tail -40 || true
            helm -n sailpoint status sailpoint || true
            exit 1
          fi

      - name: Ensure public surface (academy + edge)
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          chmod +x learn/k8s/install-public-surface.sh
          LIVE=$(kubectl -n sailpoint get deploy mnb-learn -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          if [[ "$LIVE" == *:* ]]; then
            LEARN_IMAGE_TAG="${LIVE##*:}"
            export LEARN_IMAGE_TAG
          else
            echo "::error::mnb-learn is not installed; run Publish learn site once before homelab deploy."
            exit 1
          fi
          ./learn/k8s/install-public-surface.sh

      - name: Wait for IdentityIQ rollout
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          kubectl -n sailpoint rollout status deploy/identityiq --timeout=12m
          kubectl -n sailpoint get pods -l app.kubernetes.io/name=identityiq -o wide

      - name: Import custom SSB objects into IIQ DB
        # Image bake puts XML under WEB-INF/config/custom; objects appear in Debug only after import.
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          chmod +x deploy/helm/scripts/import-custom-objects.sh
          ./deploy/helm/scripts/import-custom-objects.sh

      - name: Wipe Meridian academy leftovers (opt-in)
        if: inputs.wipe_mnb_leftovers == true
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          chmod +x tools/iiq-verify/wipe-mnb-leftovers.sh
          ./tools/iiq-verify/wipe-mnb-leftovers.sh k8s
          # Re-import smoke Rule in case wipe removed a duplicate/stale copy
          ./deploy/helm/scripts/import-custom-objects.sh

      - name: In-cluster smoke (opt-in)
        if: inputs.run_smoke == true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          bash .github/scripts/smoke-in-cluster-surface.sh

  smoke-iiq:
    name: Smoke public surface
    needs: helm-upgrade
    if: >
      always() &&
      needs.helm-upgrade.result == 'success' &&
      inputs.run_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe sailpoint.lmsapp.us (/ and /identityiq)
        run: |
          set -euo pipefail
          bash .github/scripts/smoke-public-surface.sh

  deploy-gate:
    name: Deploy gate
    needs: [decide, helm-upgrade, smoke-iiq]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate
        env:
          DECIDE: ${{ needs.decide.result }}
          DEPLOY: ${{ needs.decide.outputs.deploy }}
          REASON: ${{ needs.decide.outputs.reason }}
          HELM: ${{ needs.helm-upgrade.result }}
          SMOKE: ${{ needs.smoke-iiq.result }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "## Homelab deploy (sailpoint)"
            echo ""
            echo "- Ref: \`${REF}\`"
            echo "- Decide job: \`${DECIDE}\` → deploy=\`${DEPLOY}\` (${REASON:-})"
            echo "- Helm: \`${HELM}\`"
            echo "- Smoke: \`${SMOKE}\` (opt-in; skipped is OK)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DECIDE" != "success" ]; then
            echo "::error::Decide job failed"
            exit 1
          fi
          if [ "$DEPLOY" != "true" ]; then
            echo "Skipped deploy — ${REASON}"
            exit 0
          fi
          if [ "$HELM" != "success" ]; then
            echo "::error::Helm upgrade failed"
            exit 1
          fi
          if [ "$SMOKE" != "success" ] && [ "$SMOKE" != "skipped" ]; then
            echo "::error::Opt-in smoke failed"
            exit 1
          fi
          echo "Deploy gate passed"
