name: Deploy homelab

# Tailscale → Helm into namespace sailpoint → smoke https://sailpoint.lmsapp.us
#
# Required secrets (reuse Beyond-Boilerplate org / same as nepaledu-platform):
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, HOMELAB_KUBECONFIG
#
# Setup: docs/HOMELAB-CD.md

on:
  # Helm/ops-only: redeploy without rebuilding the image
  push:
    branches: [main, master]
    paths:
      - deploy/**
      - .github/scripts/ensure-ghcr-pull-secret.sh
      - .github/scripts/smoke-in-cluster-surface.sh
      - .github/scripts/smoke-public-surface.sh
      - .github/workflows/deploy-homelab.yml
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: Skip public smoke after Helm
        type: boolean
        default: false
      image_tag:
        description: GHCR tag (sha7 or semver). Empty on ops-only keeps live tag (CI still requires pin after publish).
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      skip_smoke:
        description: Skip public smoke after Helm
        type: boolean
        default: false
      image_tag:
        description: Immutable GHCR tag emitted by the publisher
        type: string
        required: true
concurrency:
  # Shared with publish-learn so kubectl and Helm never race in this namespace.
  group: homelab-sailpoint-deploy
  cancel-in-progress: false

permissions: {}

env:
  IIQ_SMOKE_URL: https://sailpoint.lmsapp.us/identityiq/login.jsf

jobs:
  helm-upgrade:
    name: Helm upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: homelab
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connect Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.HOMELAB_TS_PING_IP || '192.168.50.11' }}

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Write kubeconfig
        env:
          HOMELAB_KUBECONFIG: ${{ secrets.HOMELAB_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${HOMELAB_KUBECONFIG}" ]; then
            echo "::error::Missing secret HOMELAB_KUBECONFIG"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$HOMELAB_KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          export KUBECONFIG="$HOME/.kube/config"
          SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          echo "API server: ${SERVER}"

      - name: Verify cluster
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          kubectl get nodes
          kubectl -n sailpoint get deploy,pods 2>/dev/null || echo "namespace sailpoint not ready yet"

      - name: Ensure ghcr-pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          bash .github/scripts/ensure-ghcr-pull-secret.sh

      - name: Helm upgrade sailpoint
        env:
          VERIFY_IMAGE_TAGS: "true"
          GHCR_OWNER: ${{ github.repository_owner }}
          HELM_TIMEOUT: 15m
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          chmod +x deploy/helm/scripts/install-sailpoint.sh deploy/helm/scripts/update-deps.sh

          # Private GHCR packages need auth for imagetools inspect
          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME:-${{ github.actor }}}" --password-stdin
          else
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
            export IMAGE_TAG
            echo "Deploying requested IMAGE_TAG=${IMAGE_TAG}"
          else
            # Ops-only (push to deploy/** or empty dispatch): keep live tag, else VERSION
            LIVE=$(kubectl -n sailpoint get deploy identityiq -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            if [[ "$LIVE" == *:* ]]; then
              IMAGE_TAG="${LIVE##*:}"
              export IMAGE_TAG
              echo "Preserving live IMAGE_TAG=${IMAGE_TAG} (${{ github.event_name }})"
            else
              IMAGE_TAG="$(tr -d '[:space:]' < VERSION)"
              export IMAGE_TAG
              echo "Bootstrap IMAGE_TAG=${IMAGE_TAG} from VERSION"
            fi
          fi
          if ! ./deploy/helm/scripts/install-sailpoint.sh deploy/helm/values/local-homelab.yaml; then
            echo "::error::Helm upgrade failed"
            kubectl -n sailpoint get deploy,pods,pvc,svc,jobs -o wide || true
            kubectl -n sailpoint get events --sort-by=.lastTimestamp | tail -40 || true
            helm -n sailpoint status sailpoint || true
            exit 1
          fi

      - name: Ensure public surface (academy + edge)
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          chmod +x learn/k8s/install-public-surface.sh
          # Ops deploys preserve the immutable academy image already running.
          LIVE=$(kubectl -n sailpoint get deploy mnb-learn -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          if [[ "$LIVE" == *:* ]]; then
            LEARN_IMAGE_TAG="${LIVE##*:}"
            export LEARN_IMAGE_TAG
          else
            echo "::error::mnb-learn is not installed; run Publish learn site once before homelab deploy."
            exit 1
          fi
          ./learn/k8s/install-public-surface.sh

      - name: Wait for IdentityIQ rollout
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          # Give Tomcat time before in-cluster / public smoke; do not fail the job if the
          # deployment is stuck — smoke scripts emit diagnostics instead.
          kubectl -n sailpoint rollout status deploy/identityiq --timeout=8m || \
            echo "::warning::identityiq rollout not ready yet; continuing to smoke diagnostics"

      - name: In-cluster smoke (edge path split)
        # Retries IIQ through edge while Tomcat warms (see smoke-in-cluster-surface.sh).
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"
          bash .github/scripts/smoke-in-cluster-surface.sh

  smoke-iiq:
    name: Smoke public surface
    needs: helm-upgrade
    if: >
      always() &&
      needs.helm-upgrade.result == 'success' &&
      inputs.skip_smoke != true
    runs-on: ubuntu-latest
    # IIQ often returns 504 while Tomcat warms; smoke script retries ~6 minutes.
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe sailpoint.lmsapp.us (/ and /identityiq)
        run: |
          set -euo pipefail
          bash .github/scripts/smoke-public-surface.sh

  deploy-gate:
    name: Deploy gate
    needs: [helm-upgrade, smoke-iiq]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate
        env:
          HELM: ${{ needs.helm-upgrade.result }}
          SMOKE: ${{ needs.smoke-iiq.result }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "## Homelab deploy (sailpoint)"
            echo ""
            echo "- Ref: \`${REF}\`"
            echo "- Helm: \`${HELM}\`"
            echo "- Smoke IIQ: \`${SMOKE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HELM" != "success" ]; then
            echo "::error::Helm upgrade failed"
            exit 1
          fi
          if [ "$SMOKE" != "success" ] && [ "$SMOKE" != "skipped" ]; then
            echo "::error::Smoke failed"
            exit 1
          fi
          echo "Deploy gate passed"
