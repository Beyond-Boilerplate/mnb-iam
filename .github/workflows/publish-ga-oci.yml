name: Publish GA OCI

# Pushes SailPoint GA zip as an OCI artifact to GHCR (not as a container image).
# One-time / rare: identityiq-8.5.zip → ghcr.io/<owner>/mnb-iam-ga:8.5
#
# Required: base/ga/identityiq-8.5.zip present locally when dispatching,
#   OR attach via workflow_dispatch file upload is not supported — use
#   workflow_dispatch after committing via temporary path, OR run
#   .github/scripts/publish-ga-oci.sh from a trusted machine with GHCR auth.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: OCI artifact tag (IIQ major.minor)
        required: true
        default: "8.5"
        type: string

permissions: {}

concurrency:
  group: publish-ga-oci
  cancel-in-progress: false

jobs:
  publish-ga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure GA zip present
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be an IIQ major.minor version; got '${TAG}'"
            exit 1
          fi
          ZIP="base/ga/identityiq-${TAG}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Missing ${ZIP}"
            echo "Store the GA zip out-of-band, then either:"
            echo "  1) Run .github/scripts/publish-ga-oci.sh locally with GHCR login, or"
            echo "  2) Temporarily place the zip for this workflow (prefer not committing to git)."
            exit 1
          fi
          ls -lh "$ZIP"

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI artifact
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REF="ghcr.io/${OWNER}/mnb-iam-ga:${TAG}"
          ZIP="base/ga/identityiq-${TAG}.zip"
          oras push "$REF" \
            --artifact-type application/vnd.sailpoint.iiq.ga.v1+zip \
            "${ZIP}:application/zip"
          echo "Published ${REF}"
          {
            echo "### GA OCI"
            echo ""
            echo "\`${REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
