[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iiq-mcp"
version = "0.1.0"
description = "IdentityIQ MCP server — Phase 1 visibility tools + full catalog stubs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0",
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iiq-mcp = "iiq_mcp.server:main"
iiq-mcp-generate-index = "iiq_mcp.client.generate_index:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iiq_mcp = ["client/op_index.json", "tools/catalog.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: live calls against a running IdentityIQ instance",
]
