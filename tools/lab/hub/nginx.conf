server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location = /favicon.ico {
    types { }
    default_type image/svg+xml;
    alias /usr/share/nginx/html/icons/hub.svg;
  }

  location /icons/ {
    default_type image/svg+xml;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
