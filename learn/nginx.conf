# nginx.conf kept for local static experiments only.
# Production academy image (learn/Dockerfile) runs tools/academy/serve.py
# with /api/verify against IdentityIQ — not this file.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    charset utf-8;

    # Academy at site root (https://sailpoint.lmsapp.us/)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # Back-compat for earlier /learn URLs
    location = /learn {
        return 301 /;
    }
    location /learn/ {
        rewrite ^/learn/(.*)$ /$1 permanent;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
