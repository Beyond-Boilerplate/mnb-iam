apiVersion: v1
kind: ServiceAccount
metadata:
  name: mnb-learn
  namespace: sailpoint
  labels:
    app.kubernetes.io/name: mnb-learn
---
# Allow Verify now to fall back to iiq console via kubectl exec into IdentityIQ pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mnb-learn-iiq-exec
  namespace: sailpoint
  labels:
    app.kubernetes.io/name: mnb-learn
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mnb-learn-iiq-exec
  namespace: sailpoint
  labels:
    app.kubernetes.io/name: mnb-learn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mnb-learn-iiq-exec
subjects:
  - kind: ServiceAccount
    name: mnb-learn
    namespace: sailpoint
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnb-learn
  namespace: sailpoint
  labels:
    app.kubernetes.io/name: mnb-learn
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: mnb-learn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mnb-learn
    spec:
      serviceAccountName: mnb-learn
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: academy
          image: ghcr.io/beyond-boilerplate/mnb-iam-learn:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ACADEMY_HOST
              value: "0.0.0.0"
            - name: ACADEMY_PORT
              value: "8080"
            - name: IIQ_BASE_URL
              value: "http://identityiq.sailpoint.svc.cluster.local:8080/identityiq"
            - name: IIQ_VERIFY_MODE
              value: "k8s"
            - name: NAMESPACE
              value: "sailpoint"
            - name: IIQ_DEPLOYMENT
              value: "identityiq"
            - name: IIQ_USER
              value: "spadmin"
            - name: IIQ_PASSWORD
              value: "admin"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mnb-learn
  namespace: sailpoint
  labels:
    app.kubernetes.io/name: mnb-learn
spec:
  selector:
    app.kubernetes.io/name: mnb-learn
  ports:
    - name: http
      port: 8080
      targetPort: http
