apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnb-learn
  namespace: sailpoint
  labels:
    app.kubernetes.io/name: mnb-learn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mnb-learn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mnb-learn
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: nginx
          image: ghcr.io/beyond-boilerplate/mnb-iam-learn:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mnb-learn
  namespace: sailpoint
  labels:
    app.kubernetes.io/name: mnb-learn
spec:
  selector:
    app.kubernetes.io/name: mnb-learn
  ports:
    - name: http
      port: 8080
      targetPort: http
