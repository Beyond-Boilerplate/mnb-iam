# Meridian local stack: Postgres + OpenLDAP + JDBC sample + connector mock
#                   + IdentityIQ + Academy + MCP + OpenAPI + Teller
#
# One command:
#   ./tools/lab/docker/up.sh
#   # or: docker compose -f docker-compose.iiq.yml up -d --build
#
# URLs:
#   Lab hub   http://localhost:9000/  (TOC of all local services)
#   DB viewer http://localhost:9001/  (Adminer — IIQ Postgres + JDBC lab, one-click)
#   Academy   http://localhost:4173/
#   IIQ       http://localhost:8080/identityiq  (spadmin / admin)
#   OpenAPI   http://localhost:8765/swagger/
#   MCP       http://127.0.0.1:8766/mcp  (Bearer ${MCP_API_KEY:-mnb-lab-mcp-key})
#   Teller    http://localhost:4180/  (chatbot; set OPENROUTER_API_KEY for free-text)
#   Console   http://localhost:4180/console.html  (Waves 1–3 operator desks)
#   Org chart http://localhost:4180/orgchart.html
#   Auto-story http://localhost:4180/auto-story.html  (Jira runner ledger / dry-run)
#   OpenLDAP  ldap://localhost:389  (cn=admin,dc=meridiannb,dc=com / admin)
#   LDAP UI   http://localhost:8090/  (phpLDAPadmin; same admin bind)
#   JDBC lab  localhost:5435  (mnb/mnb @ mnb_apps) — Lessons 63–64
#   API mock  http://localhost:8091/  — Lessons 68–69 (Wire Portal + SCIM)
#
# Tear down: ./tools/lab/docker/down.sh [-v]
#
# OpenLDAP, jdbc-pg, and connector-mock are part of this stack.

name: mnb-iiq-lab

services:
  # Static TOC of all lab URLs — starts immediately (no IIQ dependency)
  lab-hub:
    image: nginx:1.27-alpine
    container_name: mnb-lab-hub
    ports:
      - "${LAB_HUB_PORT:-9000}:80"
    volumes:
      - ./tools/lab/hub/index.html:/usr/share/nginx/html/index.html:ro
      - ./tools/lab/hub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tools/lab/hub/icons:/usr/share/nginx/html/icons:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  openldap:
    build:
      context: .
      dockerfile: docker/Dockerfile.openldap
    image: ${OPENLDAP_IMAGE:-mnb-openldap:local}
    container_name: mnb-openldap
    environment:
      LDAP_ORGANISATION: "Meridian National Bank"
      LDAP_DOMAIN: "meridiannb.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "svc-iiq-read"
      LDAP_READONLY_USER_PASSWORD: "Readonly1!"
    ports:
      - "${LDAP_PORT:-389}:389"
      - "${LDAPS_PORT:-636}:636"
    volumes:
      - mnb-openldap-data:/var/lib/ldap
      - mnb-openldap-config:/etc/ldap/slapd.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://127.0.0.1:389 -b dc=meridiannb,dc=com -D cn=admin,dc=meridiannb,dc=com -w admin '(uid=helen.ross)' dn | grep -q 'uid=helen.ross'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  openldap-provision-acl:
    image: ${OPENLDAP_IMAGE:-mnb-openldap:local}
    container_name: mnb-openldap-acl-init
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      LDAP_HOST: openldap
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_PASSWORD: config
      LDAP_PROVISION_PASSWORD: Provision1!
    entrypoint: ["/opt/mnb/apply-provision-acl.sh"]
    restart: "no"

  # Free web LDAP browser (osixia companion to OpenLDAP)
  phpldapadmin:
    image: ${PHPLDAPADMIN_IMAGE:-osixia/phpldapadmin:0.9.0}
    container_name: mnb-phpldapadmin
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      PHPLDAPADMIN_HTTPS: "false"
      # Prefill Meridian admin bind; disable TLS to plain :389 inside the compose network
      PHPLDAPADMIN_LDAP_HOSTS: "#PYTHON2BASH:[{'openldap': [{'server': [{'tls': False, 'port': 389}]}, {'login': [{'bind_id': 'cn=admin,dc=meridiannb,dc=com'}]}]}]"
    ports:
      - "${PHPLDAPADMIN_PORT:-8090}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -o /dev/null http://127.0.0.1:80/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  # Sample app DB for JDBC lessons (NOT the IIQ database — that is `postgres` :5433)
  jdbc-pg:
    image: postgres:16-alpine
    container_name: mnb-jdbc-sample
    environment:
      POSTGRES_USER: mnb
      POSTGRES_PASSWORD: mnb
      POSTGRES_DB: mnb_apps
    ports:
      - "${JDBC_PG_PORT:-5435}:5432"
    volumes:
      - ./lab-data/connectors/jdbc/mnb_core_accounts.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mnb-jdbc-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnb -d mnb_apps"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Adminer with baked-in IIQ Postgres + JDBC lab connections (dropdown + Auto Sign-In)
  db-viewer:
    image: ${DB_VIEWER_IMAGE:-dockette/adminer:postgres}
    container_name: mnb-db-viewer
    depends_on:
      postgres:
        condition: service_healthy
      jdbc-pg:
        condition: service_healthy
    environment:
      ADMINER_PLUGIN_SERVER_LIST: "1"
      # Suffix after ADMINER_SERVERS_ is the dropdown label
      ADMINER_SERVERS_IIQ_Postgres: "pgsql://postgres:postgres@postgres:5432/identityiq"
      ADMINER_SERVERS_IIQ_identityiq: "pgsql://identityiq:identityiq@postgres:5432/identityiq"
      ADMINER_SERVERS_JDBC_Lab: "pgsql://mnb:mnb@jdbc-pg:5432/mnb_apps"
    ports:
      - "${DB_VIEWER_PORT:-9001}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  # Wire Portal REST + SCIM 2.0 mock for Lessons 68–69
  connector-mock:
    build:
      context: .
      dockerfile: docker/Dockerfile.connector-mock
    image: ${CONNECTOR_MOCK_IMAGE:-mnb-connector-mock:local}
    container_name: mnb-connector-mock
    ports:
      - "${CONNECTOR_MOCK_PORT:-8091}:8091"
    environment:
      MOCK_HOST: "0.0.0.0"
      MOCK_PORT: "8091"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - mnb-iiq-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  schema-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      IIQ_DB_PASSWORD: identityiq
      IIQ_PLUGIN_DB_PASSWORD: identityiqPlugin
      IIQ_AH_DB_PASSWORD: identityiqah
    volumes:
      - ./docs/vendor/iiq-8.5/database/create_identityiq_tables-8.5.postgresql:/sql/create_identityiq_tables-8.5.postgresql:ro
      - ./tools/lab/docker/schema-init.sh:/schema-init.sh:ro
    entrypoint: ["/bin/sh", "/schema-init.sh"]
    restart: "no"

  identityiq:
    image: ${IIQ_IMAGE:-ghcr.io/beyond-boilerplate/identityiq:0.1.0}
    container_name: mnb-identityiq
    depends_on:
      schema-init:
        condition: service_completed_successfully
      openldap:
        condition: service_healthy
      openldap-provision-acl:
        condition: service_completed_successfully
    ports:
      - "${IIQ_HTTP_PORT:-8080}:8080"
    environment:
      IIQ_DB_TYPE: postgresql
      IIQ_DB_URL: jdbc:postgresql://postgres:5432/identityiq
      IIQ_DB_USER: identityiq
      IIQ_DB_PASSWORD: identityiq
      IIQ_PLUGIN_DB_URL: jdbc:postgresql://postgres:5432/identityiqPlugin
      IIQ_PLUGIN_DB_USER: identityiqPlugin
      IIQ_PLUGIN_DB_PASSWORD: identityiqPlugin
      IIQ_AH_DB_URL: jdbc:postgresql://postgres:5432/identityiqah
      IIQ_AH_DB_USER: identityiqah
      IIQ_AH_DB_PASSWORD: identityiqah
    volumes:
      - ./lab-data:/opt/iiq-lab-data:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/identityiq/login.jsf || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  academy:
    build:
      context: .
      dockerfile: docker/Dockerfile.academy
    image: ${ACADEMY_IMAGE:-mnb-academy:local}
    container_name: mnb-academy
    depends_on:
      identityiq:
        condition: service_healthy
    ports:
      - "${ACADEMY_PORT:-4173}:4173"
    environment:
      ACADEMY_HOST: "0.0.0.0"
      ACADEMY_PORT: "4173"
      IIQ_BASE_URL: http://identityiq:8080/identityiq
      IIQ_USER: spadmin
      IIQ_PASSWORD: admin
      IIQ_VERIFY_MODE: docker
      IIQ_DOCKER_CONTAINER: mnb-identityiq
    volumes:
      # Console fallback for object.exists checks (docker exec into IIQ)
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/api/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  iiq-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    image: ${MCP_IMAGE:-mnb-iiq-mcp:local}
    container_name: mnb-iiq-mcp
    depends_on:
      identityiq:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8766}:8766"
    environment:
      IIQ_BASE_URL: http://identityiq:8080/identityiq
      IIQ_USER: ${IIQ_USER:-spadmin}
      IIQ_PASSWORD: ${IIQ_PASSWORD:-admin}
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8766"
      MCP_PATH: /mcp
      # Required when binding non-loopback inside the container
      MCP_API_KEY: ${MCP_API_KEY:-mnb-lab-mcp-key}
      IIQ_MCP_ENABLED_PHASES: ${IIQ_MCP_ENABLED_PHASES:-1,2,3,4}
      IIQ_MCP_MAX_RPS: ${IIQ_MCP_MAX_RPS:-5}
      IIQ_MCP_MAX_CONCURRENT: ${IIQ_MCP_MAX_CONCURRENT:-4}
      IIQ_MCP_AUDIT_LOG: /var/mcp/mcp-write-audit.jsonl
      IIQ_MCP_IDEMPOTENCY_DB: /var/mcp/mcp-idempotency.sqlite
      IIQ_MCP_HTTP_TIMEOUT_SECONDS: ${IIQ_MCP_HTTP_TIMEOUT_SECONDS:-60}
    volumes:
      - mnb-mcp-data:/var/mcp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-docs:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-docs
    image: ${API_DOCS_IMAGE:-mnb-api-docs:local}
    container_name: mnb-api-docs
    depends_on:
      identityiq:
        condition: service_healthy
    ports:
      - "${API_DOCS_PORT:-8765}:8765"
    environment:
      IIQ_BASE: http://identityiq:8080
      API_DOCS_BIND: "0.0.0.0"
      API_DOCS_PORT: "8765"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/swagger/')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  iiq-chat:
    build:
      context: .
      dockerfile: docker/Dockerfile.chat
    image: ${CHAT_IMAGE:-mnb-iiq-chat:local}
    container_name: mnb-iiq-chat
    depends_on:
      iiq-mcp:
        condition: service_healthy
    ports:
      - "${CHAT_PORT:-4180}:4180"
    volumes:
      # Live UI + ledger browser + fixture dry-runs from the host tree
      - ./tools/iiq-chat:/app/tools/iiq-chat
      - ./scripts:/app/scripts
      - ./jira-stories:/app/jira-stories
      - ./.ai-delivery:/app/.ai-delivery
    env_file:
      - path: tools/iiq-chat/.env
        required: false
    environment:
      CHAT_HOST: "0.0.0.0"
      CHAT_PORT: "4180"
      SAILPOINT_ROOT: /app
      PYTHONPATH: /app
      IIQ_MCP_URL: http://iiq-mcp:8766/mcp
      MCP_API_KEY: ${MCP_API_KEY:-mnb-lab-mcp-key}
      IIQ_BASE_URL: http://identityiq:8080/identityiq
      IIQ_USER: ${IIQ_USER:-spadmin}
      IIQ_PASSWORD: ${IIQ_PASSWORD:-admin}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-openrouter/free,meta-llama/llama-3.3-70b-instruct:free,google/gemma-3-27b-it:free,inclusionai/ling-3.0-flash:free,cohere/north-mini-code:free,google/gemma-4-26b-a4b-it:free}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-http://localhost:4180}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4180/api/config')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mnb-iiq-pg:
  mnb-mcp-data:
  mnb-openldap-data:
  mnb-openldap-config:
  mnb-jdbc-pg:
