components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Browser session cookie after UI login.
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: "http://localhost:8080/identityiq/oauth2/token"
          scopes: {}
  schemas:
    UnknownJson:
      type: object
      additionalProperties: true
      description: Placeholder. Exact schema not present in bytecode annotations. Capture via live probing / SailPoint product docs. Tracked in GAPS.md.
    Problemish:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
    MnbToolkitPingResponse:
      type: object
      required:
        - status
        - bank
      properties:
        status:
          type: string
          example: ok
        bank:
          type: string
          example: MNB
        plugin:
          type: string
          example: mnb-iam-toolkit
        version:
          type: string
          example: 1.1.0
    MnbTaskRunRequest:
      type: object
      required:
        - taskName
      properties:
        taskName:
          type: string
          description: Exact TaskDefinition name (must match allowedTaskNames).
          example: Refresh Identity Cube
        sync:
          type: boolean
          default: false
          description: Prefer false for aggregations; true blocks HTTP until complete.
        args:
          type: object
          additionalProperties: true
          description: Task arguments (e.g. applications filter).
    MnbTaskRunResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - accepted
            - running
            - success
            - failed
        taskName:
          type: string
        taskResultId:
          type: string
        taskResultName:
          type: string
        sync:
          type: boolean
        complete:
          type: boolean
        success:
          type: boolean
        percentComplete:
          type: integer
        bank:
          type: string
          example: MNB
security:
  - basicAuth: []
  - sessionCookie: []
