paths:
  /mnbToolkit/agent/gaps:
    get:
      tags:
        - UIAPI-META
        - meridian-agent
      summary: Gap matrix for MCP planners
      operationId: get_mnbToolkit_agent_gaps
      x-uiapi-id: UIAPI-META
      x-agent-status: implemented
      x-mcp-tool: iiq_uiapi_meta_get
      responses:
        "200":
          description: Success envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnvelope"
        "403":
          description: Denied / feature flag off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "501":
          description: Rejected or deferred for agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
      security:
        - basicAuth: []
  /mnbToolkit/ping:
    get:
      tags:
        - UIAPI-27
        - meridian-agent
      summary: Toolkit health ping
      operationId: get_mnbToolkit_ping
