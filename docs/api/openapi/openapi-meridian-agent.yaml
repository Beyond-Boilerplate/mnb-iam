openapi: 3.0.3
info:
  title: Meridian Custom APIs
  version: 1.3.16
  description: "Bank-owned IdentityIQ Custom APIs for MCP / ITSM orchestration. Closes UI-VS-API gaps (UIAPI-01\u202690 + ROI 97/98/105\u2013107/139). Open register UIAPI-91\u2026167 advertised via GET /agent/gaps. High-risk ops require plugin settings (mutateGovernanceEnabled, passwordResetEnabled, advancedOpsEnabled). See docs/api/UI-VS-API-GAPS.md and docs/api/MCP-TOOLS.md."
  x-gap-register:
    - id: UIAPI-01
      category: tasks
      status: implemented
      primaryPath: POST /mnbToolkit/tasks/run
      notes: Run allowlisted aggregation-style tasks
      mcpTool: iiq_uiapi_01
    - id: UIAPI-02
      category: tasks
      status: implemented
      primaryPath: POST /mnbToolkit/tasks/run
      notes: Run Identity Refresh / allowlisted refresh tasks
      mcpTool: iiq_uiapi_02
    - id: UIAPI-03
      category: access-requests
      status: implemented
      primaryPath: POST /mnbToolkit/agent/accessRequests
      notes: Launch LCM-style workflow with plan args
      mcpTool: iiq_uiapi_03
    - id: UIAPI-04
      category: work-items
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/workItems/{id}/decide"
      notes: Approve/reject work item via Workflower
      mcpTool: iiq_uiapi_04
    - id: UIAPI-05
      category: certifications
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/certifications/items/{id}/decide"
      notes: Decide certification item (approve/revoke/mitigate)
      mcpTool: iiq_uiapi_05
    - id: UIAPI-06
      category: sod
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/sod/violations/{id}/mitigate"
      notes: Mitigate SoD violation (gated setting)
      mcpTool: iiq_uiapi_06
    - id: UIAPI-07
      category: applications
      status: implemented
      primaryPath: POST /mnbToolkit/agent/applications/wizard
      notes: Create/update Application via wizard fields
      mcpTool: iiq_uiapi_07
    - id: UIAPI-08
      category: applications
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/applications/{name}/config"
      notes: Read/update Application attributes (gated)
      mcpTool: iiq_uiapi_08
    - id: UIAPI-09
      category: populations
      status: implemented
      primaryPath: POST /mnbToolkit/agent/populations
      notes: Create/update GroupDefinition population
      mcpTool: iiq_uiapi_09
    - id: UIAPI-10
      category: workgroups
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/workgroups/{name}/members"
      notes: Add/remove workgroup members
      mcpTool: iiq_uiapi_10
    - id: UIAPI-11
      category: capabilities
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/identities/{name}/capabilities"
      notes: Assign/revoke Capability on identity
      mcpTool: iiq_uiapi_11
    - id: UIAPI-12
      category: passwords
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/identities/{name}/password"
      notes: Admin password set / unlock (gated)
      mcpTool: iiq_uiapi_12
    - id: UIAPI-13
      category: schedules
      status: implemented
      primaryPath: POST /mnbToolkit/agent/schedules
      notes: Create simple TaskSchedule (cron string)
      mcpTool: iiq_uiapi_13
    - id: UIAPI-14
      category: reports
      status: implemented
      primaryPath: POST /mnbToolkit/agent/reports/run
      notes: Run report TaskDefinition via toolkit task runner
      mcpTool: iiq_uiapi_14
    - id: UIAPI-15
      category: forms
      status: implemented
      primaryPath: GET /mnbToolkit/agent/forms
      notes: List/get Form objects
      mcpTool: iiq_uiapi_15
    - id: UIAPI-16
      category: quicklinks
      status: implemented
      primaryPath: GET /mnbToolkit/agent/quicklinks
      notes: List QuickLinks
      mcpTool: iiq_uiapi_16
    - id: UIAPI-17
      category: email-templates
      status: implemented
      primaryPath: GET /mnbToolkit/agent/emailTemplates
      notes: List/get EmailTemplate (edit = SSB)
      mcpTool: iiq_uiapi_17
    - id: UIAPI-18
      category: audit
      status: implemented
      primaryPath: GET /mnbToolkit/agent/audit/events
      notes: Search recent AuditEvent rows
      mcpTool: iiq_uiapi_18
    - id: UIAPI-19
      category: batch
      status: implemented
      primaryPath: POST /mnbToolkit/agent/batchRequests
      notes: Create BatchRequest object from payload
      mcpTool: iiq_uiapi_19
    - id: UIAPI-20
      category: access-history
      status: implemented
      primaryPath: GET /mnbToolkit/agent/accessHistory/status
      notes: Probe Access History / IAI Configuration presence
      mcpTool: iiq_uiapi_20
    - id: UIAPI-21
      category: connectors
      status: implemented
      primaryPath: POST /mnbToolkit/agent/connectors/testConnection
      notes: ConnectorFactory.testConfiguration for an Application
      mcpTool: iiq_uiapi_21
    - id: UIAPI-22
      category: connectors
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/applications/{name}/nativeChangeDetection"
      notes: Enable NCD flags on Application
      mcpTool: iiq_uiapi_22
    - id: UIAPI-23
      category: plugins
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/plugins*"
      notes: List / enable / base64-install plugins
      mcpTool: iiq_uiapi_23
    - id: UIAPI-24
      category: system
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/system/config"
      notes: Read/merge SystemConfiguration attributes (gated)
      mcpTool: iiq_uiapi_24
    - id: UIAPI-25
      category: config
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/objects/*"
      notes: Export/import SailPointObject XML
      mcpTool: iiq_uiapi_25
    - id: UIAPI-26
      category: plugins
      status: implemented
      primaryPath: GET /mnbToolkit/agent/study/catalog
      notes: Study plugin catalog + installed matches
      mcpTool: iiq_uiapi_26
    - id: UIAPI-27
      category: toolkit
      status: implemented
      primaryPath: GET /mnbToolkit/ping
      notes: Toolkit health ping
      mcpTool: iiq_uiapi_27
    - id: UIAPI-28
      category: entitlements
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/entitlements*"
      notes: Managed entitlements list/upsert/promote
      mcpTool: iiq_uiapi_28
    - id: UIAPI-29
      category: roles
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/roles*"
      notes: Role list/create/profiles/delete
      mcpTool: iiq_uiapi_29
    - id: UIAPI-30
      category: jml
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/jml/{event}"
      notes: Run JML lifecycle event
      mcpTool: iiq_uiapi_30
    - id: UIAPI-31
      category: certifications
      status: implemented
      primaryPath: POST /mnbToolkit/agent/certifications/campaigns
      notes: Create certification campaign
      mcpTool: iiq_uiapi_31
    - id: UIAPI-32
      category: sod
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/policies/sod*"
      notes: SoD policy list/create/delete
      mcpTool: iiq_uiapi_32
    - id: UIAPI-60
      category: console
      status: implemented
      primaryPath: "GET /mnbToolkit/agent/console/*"
      notes: Teller console desks (summary/orphans/…)
      mcpTool: iiq_uiapi_60
    - id: UIAPI-73
      category: applications
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/applications/{name}/schema/apply"
      notes: Apply discovered schema attrs
      mcpTool: iiq_uiapi_73
    - id: UIAPI-74
      category: applications
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/applications/{name}/correlationConfig"
      notes: Write correlation config
      mcpTool: iiq_uiapi_74
    - id: UIAPI-75
      category: provisioning
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/provisioning/{id}/cancel"
      notes: Cancel provisioning transaction
      mcpTool: iiq_uiapi_75
    - id: UIAPI-76
      category: jml
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/lifecycleEvents"
      notes: LifecycleEvent list/upsert
      mcpTool: iiq_uiapi_76
    - id: UIAPI-77
      category: config
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/objectConfigs/{name}/attributes"
      notes: Patch ObjectConfig attribute
      mcpTool: iiq_uiapi_77
    - id: UIAPI-78
      category: passwords
      status: implemented
      primaryPath: POST /mnbToolkit/agent/passwordPolicies
      notes: Upsert PasswordPolicy
      mcpTool: iiq_uiapi_78
    - id: UIAPI-79
      category: roles
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/roles/{name}/requirements"
      notes: Set required roles on Bundle
      mcpTool: iiq_uiapi_79
    - id: UIAPI-80
      category: sod
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/policies/sod/{name}/constraints"
      notes: Update SoD left/right constraints
      mcpTool: iiq_uiapi_80
    - id: UIAPI-81
      category: applications
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/applications/{name}/provisioningPolicies"
      notes: Provisioning policy Forms
      mcpTool: iiq_uiapi_81
    - id: UIAPI-82
      category: sod
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/policies/sod/{name}/simulate"
      notes: Simulate SoD role conflicts
      mcpTool: iiq_uiapi_82
    - id: UIAPI-83
      category: groups
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/groupFactories*"
      notes: GroupFactory upsert/run
      mcpTool: iiq_uiapi_83
    - id: UIAPI-84
      category: capabilities
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/capabilities/{name}/rights"
      notes: Set Capability SPRights
      mcpTool: iiq_uiapi_84
    - id: UIAPI-85
      category: roles
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/roles/{name}/selector"
      notes: Set Bundle assignment selector
      mcpTool: iiq_uiapi_85
    - id: UIAPI-86
      category: certifications
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/certifications/definitions/{name}"
      notes: Patch CertificationDefinition
      mcpTool: iiq_uiapi_86
    - id: UIAPI-87
      category: work-items
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/identities/{name}/forwarding"
      notes: Identity forwarding/OOO
      mcpTool: iiq_uiapi_87
    - id: UIAPI-88
      category: risk
      status: implemented
      primaryPath: POST /mnbToolkit/agent/risk/scoreConfig
      notes: Patch risk score weights
      mcpTool: iiq_uiapi_88
    - id: UIAPI-89
      category: tasks
      status: implemented
      primaryPath: POST /mnbToolkit/agent/taskDefinitions
      notes: TaskDefinition upsert
      mcpTool: iiq_uiapi_89
    - id: UIAPI-90
      category: aggregation
      status: implemented
      primaryPath: POST /mnbToolkit/agent/connectors/aggregate/stop
      notes: Stop running aggregation
      mcpTool: iiq_uiapi_90
    - id: UIAPI-97
      category: workflows
      status: implemented
      primaryPath: "GET|POST /mnbToolkit/agent/workflows*"
      notes: List/get/patch Workflow (not visual designer)
      mcpTool: iiq_uiapi_97
    - id: UIAPI-98
      category: forms
      status: implemented
      primaryPath: POST /mnbToolkit/agent/forms
      notes: Upsert top-level Form + fields
      mcpTool: iiq_uiapi_98
    - id: UIAPI-105
      category: connectors
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/applications/{name}/connector/ad"
      notes: AD/IQService deep attribute config
      mcpTool: iiq_uiapi_105
    - id: UIAPI-106
      category: connectors
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/applications/{name}/connector/jdbc"
      notes: JDBC URL/SQL map attribute config
      mcpTool: iiq_uiapi_106
    - id: UIAPI-107
      category: connectors
      status: implemented
      primaryPath: "POST /mnbToolkit/agent/applications/{name}/connector/oauth"
      notes: OAuth/SCIM attribute config
      mcpTool: iiq_uiapi_107
    - id: UIAPI-139
      category: sod
      status: implemented
      primaryPath: POST /mnbToolkit/agent/policies/sod/matrix/import
      notes: SoD matrix CSV/rows → policy constraints
      mcpTool: iiq_uiapi_139
