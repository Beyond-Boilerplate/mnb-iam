      security:
        - basicAuth: []
  /mnbToolkit/tasks/run:
    post:
      tags:
        - UIAPI-02
        - meridian-agent
      summary: Run allowlisted task (refresh)
      operationId: post_mnbToolkit_tasks_run
      x-uiapi-id: UIAPI-02
      x-agent-status: implemented
      x-mcp-tool: iiq_uiapi_02_post
      responses:
        "200":
          description: Success envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnvelope"
        "403":
          description: Denied / feature flag off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "501":
          description: Rejected or deferred for agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
  "/mnbToolkit/tasks/results/{id}":
    get:
