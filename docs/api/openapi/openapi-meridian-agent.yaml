components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: "http://localhost:8080/identityiq/oauth2/token"
          scopes: {}
  schemas:
    AgentEnvelope:
      type: object
      properties:
        status:
          type: string
        gapId:
          type: string
        bank:
          type: string
          example: MNB
        plugin:
          type: string
          example: mnb_iam_toolkit
        data:
          type: object
          additionalProperties: true
        messages:
          type: array
          items:
            type: string
    AgentError:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        status:
          type: integer
        gapId:
          type: string
        guidance:
          type: string
    AgentRequest:
      type: object
      additionalProperties: true
      description: Operation-specific JSON body (see MCP-TOOLS.md).
security:
  - basicAuth: []
