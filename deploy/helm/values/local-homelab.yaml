# Homelab (k3s) — Beyond-Boilerplate / mnb-iam
# Public URL: https://sailpoint.lmsapp.us/identityiq/login.jsf
# Cloudflare Tunnel (no Access for now):
#   sailpoint.lmsapp.us → http://identityiq.sailpoint.svc.cluster.local:8080

identityiq-data:
  enabled: true
  cnpg:
    enabled: true
    name: sailpoint-pg
    # 1 instance for lab speed / single-node k3s (anti-affinity off in chart defaults)
    instances: 1
    podAntiAffinity: false
    storage:
      size: 30Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
  appUser:
    createSecret: true
    secretName: sailpoint-iiq-db
    identityiqPassword: "LabOnlyChangeMe1!"
    pluginPassword: "LabOnlyChangeMe1!"
    ahPassword: "LabOnlyChangeMe1!"
  schemaInit:
    enabled: true
    pgReadyTimeoutSeconds: 300

identityiq:
  enabled: true
  # Single replica: faster CD (one image pull / one Ready). Bump to 2 for HA demos.
  replicaCount: 1
  image:
    repository: ghcr.io/beyond-boilerplate/identityiq
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-pull
  dbSecretName: sailpoint-iiq-db
  service:
    sessionAffinity: ClientIP
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 3Gi
  probes:
    readiness:
      type: tcp
      initialDelaySeconds: 45
      periodSeconds: 10
      failureThreshold: 30
    liveness:
      type: tcp
      initialDelaySeconds: 180
