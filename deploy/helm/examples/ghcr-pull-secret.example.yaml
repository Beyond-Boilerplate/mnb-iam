# kubectl -n sailpoint apply -f ghcr-pull-secret.example.yaml
# Prefer: kubectl create secret docker-registry ghcr-pull ...
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: sailpoint
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "YOUR_GITHUB_USER",
          "password": "YOUR_GHCR_READ_PAT",
          "auth": "BASE64(user:pat)"
        }
      }
    }
