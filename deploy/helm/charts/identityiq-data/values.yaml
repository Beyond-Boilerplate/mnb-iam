cnpg:
  enabled: true
  name: sailpoint-pg
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  enableSuperuserAccess: true
  # Hard anti-affinity needs ≥N nodes; leave false for single/small k3s labs
  podAntiAffinity: false
  storage:
    size: 30Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  bootstrap:
    database: postgres
    owner: postgres

appUser:
  createSecret: true
  secretName: sailpoint-iiq-db
  # Used by IIQ JDBC (identityiq / plugin / ah) — override in secrets file for prod
  identityiqPassword: "LabOnlyChangeMe1!"
  pluginPassword: "LabOnlyChangeMe1!"
  ahPassword: "LabOnlyChangeMe1!"

schemaInit:
  enabled: true
  image: postgres:16-alpine
  # Fail fast instead of hanging helm --wait for 15m
  pgReadyTimeoutSeconds: 300
