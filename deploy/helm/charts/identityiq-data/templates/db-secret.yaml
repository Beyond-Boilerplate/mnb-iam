{{- if .Values.appUser.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appUser.secretName }}
  labels:
    app.kubernetes.io/name: identityiq-data
type: Opaque
stringData:
  IIQ_DB_USER: identityiq
  IIQ_DB_PASSWORD: {{ .Values.appUser.identityiqPassword | quote }}
  IIQ_PLUGIN_DB_USER: identityiqPlugin
  IIQ_PLUGIN_DB_PASSWORD: {{ .Values.appUser.pluginPassword | quote }}
  IIQ_AH_DB_USER: identityiqah
  IIQ_AH_DB_PASSWORD: {{ .Values.appUser.ahPassword | quote }}
  IIQ_DB_HOST: {{ printf "%s-rw" .Values.cnpg.name | quote }}
  IIQ_DB_PORT: "5432"
  IIQ_DB_TYPE: postgresql
  IIQ_DB_URL: {{ printf "jdbc:postgresql://%s-rw:5432/identityiq" .Values.cnpg.name | quote }}
  IIQ_PLUGIN_DB_URL: {{ printf "jdbc:postgresql://%s-rw:5432/identityiqPlugin" .Values.cnpg.name | quote }}
  IIQ_AH_DB_URL: {{ printf "jdbc:postgresql://%s-rw:5432/identityiqah" .Values.cnpg.name | quote }}
{{- end }}
