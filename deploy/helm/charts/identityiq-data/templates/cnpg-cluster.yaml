{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.name }}
  labels:
    app.kubernetes.io/name: identityiq-data
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
spec:
  instances: {{ .Values.cnpg.instances }}
  imageName: {{ .Values.cnpg.imageName | quote }}
  enableSuperuserAccess: {{ .Values.cnpg.enableSuperuserAccess }}
  storage:
    size: {{ .Values.cnpg.storage.size }}
    {{- with .Values.cnpg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.cnpg.resources | nindent 4 }}
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.bootstrap.database }}
      owner: {{ .Values.cnpg.bootstrap.owner }}
  {{- if .Values.cnpg.podAntiAffinity }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  {{- end }}
{{- end }}
