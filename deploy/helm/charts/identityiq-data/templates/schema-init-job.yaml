{{- if and .Values.cnpg.enabled .Values.schemaInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.cnpg.name }}-schema-init
  labels:
    app.kubernetes.io/name: identityiq-data
    app.kubernetes.io/component: schema-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identityiq-data
        app.kubernetes.io/component: schema-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-init
          image: {{ .Values.schemaInit.image | quote }}
          env:
            - name: PGHOST
              value: {{ printf "%s-rw" .Values.cnpg.name | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-superuser" .Values.cnpg.name | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-superuser" .Values.cnpg.name | quote }}
                  key: password
            - name: IIQ_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appUser.secretName | quote }}
                  key: IIQ_DB_PASSWORD
            - name: IIQ_PLUGIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appUser.secretName | quote }}
                  key: IIQ_PLUGIN_DB_PASSWORD
            - name: IIQ_AH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appUser.secretName | quote }}
                  key: IIQ_AH_DB_PASSWORD
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              echo "Waiting for Postgres at ${PGHOST}:${PGPORT}…"
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do sleep 3; done

              if psql -d postgres -Atc "SELECT 1 FROM pg_database WHERE datname='identityiq'" | grep -qx 1; then
                if psql -d identityiq -Atc "SELECT 1 FROM information_schema.tables WHERE table_schema='identityiq' AND table_name='spt_identity'" 2>/dev/null | grep -qx 1; then
                  echo "IIQ schema already present — skipping"
                  exit 0
                fi
              fi

              echo "Patching SailPoint sample passwords to match app secret…"
              sed \
                -e "s/ENCRYPTED PASSWORD 'identityiq'/ENCRYPTED PASSWORD '${IIQ_DB_PASSWORD}'/g" \
                -e "s/ENCRYPTED PASSWORD 'identityiqPlugin'/ENCRYPTED PASSWORD '${IIQ_PLUGIN_DB_PASSWORD}'/g" \
                -e "s/ENCRYPTED PASSWORD 'identityiqah'/ENCRYPTED PASSWORD '${IIQ_AH_DB_PASSWORD}'/g" \
                /sql/create_identityiq_tables-8.5.postgresql > /tmp/iiq-schema.sql

              echo "Applying IdentityIQ 8.5 PostgreSQL schema (idempotent-ish; first install)…"
              # Sample script uses \\connect; requires psql meta-commands
              psql -v ON_ERROR_STOP=1 -d postgres -f /tmp/iiq-schema.sql
              echo "Schema init complete"
      volumes:
        - name: sql
          configMap:
            name: {{ .Values.cnpg.name }}-schema-sql
{{- end }}
