{{- if and .Values.cnpg.enabled .Values.schemaInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.cnpg.name }}-schema-init
  labels:
    app.kubernetes.io/name: identityiq-data
    app.kubernetes.io/component: schema-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identityiq-data
        app.kubernetes.io/component: schema-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-init
          image: {{ .Values.schemaInit.image | quote }}
          env:
            - name: PGHOST
              value: {{ printf "%s-rw" .Values.cnpg.name | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-superuser" .Values.cnpg.name | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-superuser" .Values.cnpg.name | quote }}
                  key: password
            - name: IIQ_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appUser.secretName | quote }}
                  key: IIQ_DB_PASSWORD
            - name: IIQ_PLUGIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appUser.secretName | quote }}
                  key: IIQ_PLUGIN_DB_PASSWORD
            - name: IIQ_AH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appUser.secretName | quote }}
                  key: IIQ_AH_DB_PASSWORD
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              TIMEOUT={{ .Values.schemaInit.pgReadyTimeoutSeconds | default 300 }}
              echo "Waiting for Postgres at ${PGHOST}:${PGPORT} (timeout ${TIMEOUT}s)…"
              start=$(date +%s)
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                now=$(date +%s)
                if [ $((now - start)) -ge "$TIMEOUT" ]; then
                  echo "ERROR: Postgres not ready after ${TIMEOUT}s at ${PGHOST}"
                  exit 1
                fi
                sleep 5
              done

              # Verify superuser password works (CNPG secret can drift after interrupted installs)
              if ! psql -d postgres -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null; then
                echo "ERROR: superuser auth failed for ${PGUSER}@${PGHOST} — reset password from primary or recreate cluster"
                exit 1
              fi

              if psql -d postgres -Atc "SELECT 1 FROM pg_database WHERE datname='identityiq'" | grep -qx 1; then
                if psql -d identityiq -Atc "SELECT 1 FROM information_schema.tables WHERE table_schema='identityiq' AND table_name='spt_identity'" 2>/dev/null | grep -qx 1; then
                  echo "IIQ schema already present — skipping"
                  exit 0
                fi
              fi

              echo "Preparing SailPoint SQL for superuser + SET ROLE (PGPASSWORD stays postgres)…"
              # CREATE USER passwords must match app secret; \\connect as app users would
              # incorrectly reuse PGPASSWORD=superuser — connect as postgres then SET ROLE.
              sed \
                -e "s/ENCRYPTED PASSWORD 'identityiq'/ENCRYPTED PASSWORD '${IIQ_DB_PASSWORD}'/g" \
                -e "s/ENCRYPTED PASSWORD 'identityiqPlugin'/ENCRYPTED PASSWORD '${IIQ_PLUGIN_DB_PASSWORD}'/g" \
                -e "s/ENCRYPTED PASSWORD 'identityiqah'/ENCRYPTED PASSWORD '${IIQ_AH_DB_PASSWORD}'/g" \
                -e 's/\\connect identityiq identityiq/\\connect identityiq postgres\nSET ROLE identityiq;/' \
                -e 's/\\connect identityiqah identityiqah/\\connect identityiqah postgres\nSET ROLE identityiqah;/' \
                -e 's/\\connect "identityiqPlugin" "identityiqPlugin"/\\connect "identityiqPlugin" postgres\nSET ROLE "identityiqPlugin";/' \
                /sql/create_identityiq_tables-8.5.postgresql > /tmp/iiq-schema.sql

              echo "Applying IdentityIQ 8.5 PostgreSQL schema…"
              # Ignore duplicate role/db on re-run; fail on real DDL errors after bootstrap
              set +e
              psql -v ON_ERROR_STOP=0 -d postgres -f /tmp/iiq-schema.sql 2>&1 | tee /tmp/schema.out
              rc=${PIPESTATUS[0]}
              set -e
              if ! psql -d identityiq -Atc "SELECT 1 FROM information_schema.tables WHERE table_schema='identityiq' AND table_name='spt_identity'" | grep -qx 1; then
                echo "ERROR: spt_identity missing after schema apply (psql rc=${rc})"
                tail -50 /tmp/schema.out || true
                exit 1
              fi
              echo "Schema init complete"
      volumes:
        - name: sql
          configMap:
            name: {{ .Values.cnpg.name }}-schema-sql
{{- end }}
