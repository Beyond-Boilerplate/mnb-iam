replicaCount: 2

image:
  repository: ghcr.io/beyond-boilerplate/identityiq
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: "identityiq"

service:
  type: ClusterIP
  port: 8080
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

env:
  IIQ_DB_TYPE: postgresql

dbSecretName: sailpoint-iiq-db

waitForDb:
  enabled: true
  image: postgres:16-alpine
  timeoutSeconds: 300

# TCP probes: Tomcat listens before login.jsf is warm (IIQ cold start is slow and
# often returns 404 for minutes). Public/in-cluster smoke still hits login.jsf.
probes:
  startup:
    enabled: true
    type: tcp
    path: /identityiq/login.jsf
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  readiness:
    type: tcp
    path: /identityiq/login.jsf
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    type: tcp
    path: /identityiq/login.jsf
    initialDelaySeconds: 180
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
