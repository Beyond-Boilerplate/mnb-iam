replicaCount: 2

image:
  repository: ghcr.io/beyond-boilerplate/identityiq
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: "identityiq"

service:
  type: ClusterIP
  port: 8080
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

env:
  IIQ_DB_TYPE: postgresql

dbSecretName: sailpoint-iiq-db

waitForDb:
  enabled: true
  image: postgres:16-alpine
  timeoutSeconds: 300

# Startup waits for the real IIQ login route. This prevents a TCP-open Tomcat
# from completing the rollout while the application still returns 404/504.
probes:
  startup:
    enabled: true
    path: /identityiq/login.jsf
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 72
  readiness:
    type: http
    path: /identityiq/login.jsf
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  liveness:
    # Liveness only verifies that Tomcat is alive. DB/application health belongs
    # in readiness so a dependency outage does not restart a healthy JVM.
    type: tcp
    path: /identityiq/login.jsf
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
