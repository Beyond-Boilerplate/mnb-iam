apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnameOverride | default .Release.Name }}
  labels:
    app.kubernetes.io/name: identityiq
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: identityiq
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identityiq
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: app
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.waitForDb.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.waitForDb.image | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.dbSecretName | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              HOST="${IIQ_DB_HOST:-sailpoint-pg-rw}"
              PORT="${IIQ_DB_PORT:-5432}"
              TIMEOUT={{ .Values.waitForDb.timeoutSeconds }}
              echo "Waiting for ${HOST}:${PORT} (timeout ${TIMEOUT}s)…"
              start=$(date +%s)
              until pg_isready -h "$HOST" -p "$PORT" -U postgres >/dev/null 2>&1 \
                 || pg_isready -h "$HOST" -p "$PORT" >/dev/null 2>&1; do
                now=$(date +%s)
                if [ $((now - start)) -ge "$TIMEOUT" ]; then
                  echo "ERROR: DB not ready after ${TIMEOUT}s"
                  exit 1
                fi
                sleep 5
              done
              echo "Postgres is accepting connections"
      {{- end }}
      containers:
        - name: identityiq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: IIQ_DB_TYPE
              value: {{ .Values.env.IIQ_DB_TYPE | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.dbSecretName | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            {{- if eq (.Values.probes.readiness.type | default "http") "tcp" }}
            tcpSocket:
              port: http
            {{- else }}
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            {{- if eq (.Values.probes.liveness.type | default "http") "tcp" }}
            tcpSocket:
              port: http
            {{- else }}
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride | default .Release.Name }}
  labels:
    app.kubernetes.io/name: identityiq
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  sessionAffinityConfig:
    {{- toYaml .Values.service.sessionAffinityConfig | nindent 4 }}
  {{- end }}
  selector:
    app.kubernetes.io/name: identityiq
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
